services:
  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - "${DAILY_SEARXNG_SETTINGS_DIR:?Run Start-SearXNG.ps1 first}:/etc/searxng"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      GRANIAN_WORKERS: "1"
    mem_limit: 512m
    cpus: 0.5
    restart: "no"
